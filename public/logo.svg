<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtitle Container Frame -->
  <rect x="7" y="10" width="34" height="28" rx="6" fill="#080e1a" stroke="url(#neonCyan)" stroke-width="1.8" filter="url(#glow)" opacity="0.95"/>

  <!-- Audio Waveform in Subtitle Area -->
  <rect x="12" y="22" width="2.8" height="6" rx="1.4" fill="url(#neonCyan)"/>
  <rect x="17" y="18" width="2.8" height="13" rx="1.4" fill="url(#neonCyan)"/>
  <rect x="22" y="15" width="2.8" height="18" rx="1.4" fill="url(#neonCyan)"/>
  <rect x="27" y="19" width="2.8" height="11" rx="1.4" fill="url(#neonCyan)"/>
  <rect x="32" y="23" width="2.8" height="5" rx="1.4" fill="url(#neonCyan)"/>

  <!-- AI Neural Spark Star -->
  <path d="M36 7 L37.2 10.8 L41 12 L37.2 13.2 L36 17 L34.8 13.2 L31 12 L34.8 10.8 Z" fill="url(#neonViolet)"/>
  <circle cx="36" cy="12" r="1.5" fill="#ffffff"/>
</svg>
